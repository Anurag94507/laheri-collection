    <style>
      html { background: #fff8f0; }
      #laheri-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff8f0; z-index: 9999; transition: opacity .45s ease; }
      #laheri-boot.done { opacity: 0; pointer-events: none; }
      #laheri-boot img { width: 64px; height: 64px; border-radius: 999px; }
      #laheri-boot span { position: absolute; width: 92px; height: 92px; border-radius: 999px; border: 1px solid rgba(156, 124, 66, .55); border-top-color: #191612; animation: laheri-spin 1.1s linear infinite; }

      @media (prefers-reduced-motion: reduce) { #laheri-boot span { animation: none; } }
    </style>
    <script>
      // Capture the install prompt as early as possible so the in-app button never misses it.
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__laheriInstallPrompt = event;
      });
      // First visit in a session gets the logo curtain; later navigations skip it.
      window.__laheriShowBoot = false;
      try {
        window.__laheriShowBoot = !sessionStorage.getItem('laheri-booted');
        sessionStorage.setItem('laheri-booted', '1');
      } catch (error) {}
      document.addEventListener('DOMContentLoaded', function () {
        if (!window.__laheriShowBoot) {
          var boot = document.getElementById('laheri-boot');
          if (boot) boot.remove();
        }
      });
    </script>
